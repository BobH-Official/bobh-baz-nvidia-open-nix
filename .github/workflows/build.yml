---
name: Build container image
on:
  push:
    branches: [master]
    paths-ignore:
      - '**/README.md'
  schedule:
    - cron: '05 10 * * *'
  workflow_dispatch:
    inputs:
      rechunk:
        description: Test rpm-ostree rechunk (requires additional disk space)
        type: boolean
        default: false
      publish:
        description: Publish signed production image (master only)
        type: boolean
        default: false

# Automated builds are master-only; no pull_request trigger.
# Non-master dispatch builds locally on the runner and cannot publish.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_update:
    name: Check upstream version and digest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    outputs:
      should_build: ${{ steps.upstream.outputs.should_build }}
      upstream_image: ${{ steps.upstream.outputs.upstream_image }}
      upstream_version: ${{ steps.upstream.outputs.upstream_version }}
      upstream_digest: ${{ steps.upstream.outputs.upstream_digest }}
      base_image_ref: ${{ steps.upstream.outputs.base_image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install skopeo if needed
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y skopeo
          fi
      - name: Test version detector
        shell: pwsh
        run: .github/scripts/Test-UpstreamUpdate.ps1
      - name: Resolve upstream version and digest
        id: upstream
        shell: pwsh
        env:
          MY_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          .github/scripts/Check-UpstreamUpdate.ps1 -MyImage $env:MY_IMAGE.ToLowerInvariant() -Channel latest -ExpectedRevision $env:GITHUB_SHA

  build_push:
    name: Build and verify image
    needs: check_update
    if: needs.check_update.outputs.should_build == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Check Just syntax
        run: just check
      - name: Prepare image identity
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="$(just image_name)"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/heads/master ]]; then
            echo "DEFAULT_TAG=latest" >> "$GITHUB_ENV"
          else
            echo "DEFAULT_TAG=template-test" >> "$GITHUB_ENV"
          fi
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y skopeo
          fi
      - name: Export immutable base and version
        shell: bash
        env:
          BASE_REF: ${{ needs.check_update.outputs.base_image_ref }}
          VERSION: ${{ needs.check_update.outputs.upstream_version }}
          DIGEST: ${{ needs.check_update.outputs.upstream_digest }}
          UPSTREAM: ${{ needs.check_update.outputs.upstream_image }}
        run: |
          {
            echo "BASE_IMAGE_REF=$BASE_REF"
            echo "UPSTREAM_VERSION=$VERSION"
            echo "UPSTREAM_DIGEST=$DIGEST"
            echo "UPSTREAM_IMAGE=$UPSTREAM"
          } >> "$GITHUB_ENV"
      - name: Build image
        run: just build "$IMAGE_NAME" "$DEFAULT_TAG"
      - name: Rechunk with rpm-ostree (opt-in)
        if: inputs.rechunk
        run: just ostree-rechunk "$IMAGE_NAME" "$DEFAULT_TAG"
      - name: Verify image metadata and Nix directory
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_NAME:$DEFAULT_TAG"
          podman inspect "$image" | jq -e --arg version "$UPSTREAM_VERSION" --arg digest "$UPSTREAM_DIGEST" --arg upstream "$UPSTREAM_IMAGE" '.[0].Config.Labels | ."io.bobh.upstream.version" == $version and ."org.opencontainers.image.base.digest" == $digest and ."org.opencontainers.image.base.name" == $upstream and ."containers.bootc" == "1"'
          podman run --rm --entrypoint /usr/bin/stat "$image" -c '%u:%g' /nix | grep -Fx '30000:30000'
      - name: Generate build tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          tags="$(just generate-build-tags "$IMAGE_NAME" "$DEFAULT_TAG")"
          echo "aliases=$tags" >> "$GITHUB_OUTPUT"
          printf 'Upstream: %s (%s)\nTags: %s\n' "$UPSTREAM_VERSION" "$UPSTREAM_DIGEST" "$tags" >> "$GITHUB_STEP_SUMMARY"
          printf 'Production aliases: %s\n' "$(just generate-build-tags "$IMAGE_NAME" latest)" >> "$GITHUB_STEP_SUMMARY"
      - name: Tag image
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.aliases }}
        run: just tag-images "$IMAGE_NAME" "$DEFAULT_TAG" "$ALIAS_TAGS"
      - name: Login to GHCR (production only)
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish)
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'
      - name: Verify signing key before pushing
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ''
        shell: bash
        run: |
          set -euo pipefail
          derived="$(cosign public-key --key env://COSIGN_PRIVATE_KEY | tr -d '[:space:]')"
          expected="$(tr -d '[:space:]' < cosign.pub)"
          [[ -n "$derived" && "$derived" == "$expected" ]] || { echo "Signing key does not match cosign.pub"; exit 1; }
      - name: Push versioned image first
        id: push
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish)
        shell: bash
        run: |
          set -euo pipefail
          tag="upstream.$UPSTREAM_VERSION"
          podman push --digestfile=/tmp/digestfile "$IMAGE_NAME:$tag" "$IMAGE_REGISTRY/$IMAGE_NAME:$tag"
          echo "digest=$(cat /tmp/digestfile)" >> "$GITHUB_OUTPUT"
      - name: Sign and verify (legacy bundle for rpm-ostree)
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ''
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_REGISTRY/$IMAGE_NAME@$DIGEST"
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "$image"
          cosign verify --key cosign.pub "$image"
      - name: Promote verified image (latest last)
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish)
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.aliases }}
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_REGISTRY/$IMAGE_NAME"
          for tag in $ALIAS_TAGS; do
            [[ "$tag" != latest && "$tag" != "upstream.$UPSTREAM_VERSION" ]] || continue
            skopeo copy --preserve-digests "docker://$image@$DIGEST" "docker://$image:$tag"
          done
          skopeo copy --preserve-digests "docker://$image@$DIGEST" "docker://$image:latest"
          actual="$(skopeo inspect --format '{{.Digest}}' "docker://$image:latest")"
          [[ "$actual" == "$DIGEST" ]]
          cosign verify --key cosign.pub "$image:latest"
